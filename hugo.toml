baseURL = "https://jayinnn.dev/"
title = "Jie-Ying Lee 李杰穎"
locale = "en"
disableKinds = ["taxonomy", "term", "rss", "section"]

[params]
  author = "Jie-Ying Lee 李杰穎"
  description = "Jie-Ying Lee's personal website"
  [params.footer]
    text = "By Jie-Ying Lee 李杰穎"

[services.googleAnalytics]
  id = "G-XFCYQ29SLK"

[markup.goldmark.renderer]
  unsafe = true  # allow raw HTML in content/_index.md

[imaging]
  resampleFilter = "Lanczos"
  anchor = "Center"  # crop from the middle, matching how the hover videos are shown
  [imaging.webp]
    quality = 82

[caches]
  [caches.getresource]
    dir = ":cacheDir/:project"
    maxAge = "1h"  # default is cache-forever; 1h keeps GitHub star counts fresh locally
