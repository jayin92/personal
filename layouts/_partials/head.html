<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ site.Params.description }}">
<meta name="author" content="{{ site.Params.author }}">
<meta name="color-scheme" content="only light">
<link rel="canonical" href="{{ .Permalink }}">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/android-chrome-512x512.png">
<link rel="preload" href="/fonts/Lato-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/Lato-700.woff2" as="font" type="font/woff2" crossorigin>
{{ with resources.Get "css/main.css" | minify }}<style>{{ .Content | safeCSS }}</style>{{ end }}

{{- /* Link previews (Slack, X, iMessage, email clients). */}}
<meta property="og:type" content="profile">
<meta property="og:title" content="{{ site.Title }}">
<meta property="og:description" content="{{ site.Params.description }}">
<meta property="og:url" content="{{ .Permalink }}">
{{- with resources.Get "images/avatar.png" }}{{ with .Fill "600x600 jpg q85" }}
<meta property="og:image" content="{{ .Permalink }}">
{{- end }}{{ end }}
<meta name="twitter:card" content="summary">

{{- if hugo.IsProduction }}{{ partial "analytics.html" . }}{{ end }}
